spring.profiles.active=local
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
server.port=${PORT:8080}

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ACHADO M1: show-sql e o DEBUG de Spring Security nao tem guarda de perfil
# aqui - valeriam tambem em producao se SPRING_PROFILES_ACTIVE nao for
# setado para algo diferente de "local" no Render. Essas duas configuracoes
# agora vivem só em application-local.properties (gitignored, carregado
# apenas quando spring.profiles.active=local).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.auto_quote_keyword=true